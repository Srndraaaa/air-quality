x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform123}@postgres:5432/${AIRFLOW_DB:-airflow_meta}
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
  # Airflow 3: task di scheduler memanggil Execution API milik api-server, bukan localhost.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  # Secret JWT harus sama di semua service Airflow agar token task diterima api-server.
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-airquality-local-dev-jwt-secret-change-me}
  AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
  DW_HOST: postgres
  DW_PORT: 5432
  DW_DB: ${DW_DB:-air_quality_dw}
  DW_USER: ${POSTGRES_USER:-platform}
  DW_PASSWORD: ${POSTGRES_PASSWORD:-platform123}
  # Batas ke belakang pipeline boleh menarik data historis (hari).
  # 92 = maksimum parameter past_days Open-Meteo.
  BACKFILL_MAX_DAYS: ${BACKFILL_MAX_DAYS:-92}

x-airflow-volumes: &airflow-volumes
  - ./airflow/dags:/opt/airflow/dags
  - ./spark/jobs:/opt/airflow/spark_jobs
  - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform123}
      POSTGRES_DB: ${AIRFLOW_DB:-airflow_meta}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/00-init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql:ro
      - ./sql/01-warehouse.sql:/docker-entrypoint-initdb.d/01-warehouse.sql:ro
      - ./sql/03-streaming.sql:/docker-entrypoint-initdb.d/03-streaming.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${AIRFLOW_DB:-airflow_meta}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment: *airflow-env
    volumes: *airflow-volumes
    command: ["bash", "-c", "airflow db migrate"]

  airflow-api-server:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    ports:
      - "127.0.0.1:8080:8080"
    command: api-server
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    restart: unless-stopped

  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: dag-processor
    restart: unless-stopped

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      - spark-master
    volumes:
      - stream_data:/opt/stream
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "1", "--memory", "768m"]
    restart: unless-stopped

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      - spark-master
    volumes:
      - stream_data:/opt/stream
    command: ["spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "1", "--memory", "768m"]
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DW_HOST: postgres
      DW_PORT: 5432
      DW_DB: ${DW_DB:-air_quality_dw}
      DW_USER: ${POSTGRES_USER:-platform}
      DW_PASSWORD: ${POSTGRES_PASSWORD:-platform123}
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------- Jalur streaming ----------------
  # Simulator menulis file JSON sensor ke folder bersama setiap beberapa detik.
  sensor-simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DW_HOST: postgres
      DW_PORT: 5432
      DW_DB: ${DW_DB:-air_quality_dw}
      DW_USER: ${POSTGRES_USER:-platform}
      DW_PASSWORD: ${POSTGRES_PASSWORD:-platform123}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-3}
      SIM_DIRTY_RATE: ${SIM_DIRTY_RATE:-0.25}
    volumes:
      - stream_data:/opt/stream
    restart: unless-stopped

  # Spark Structured Streaming: baca file baru tiap 5 detik, bersihkan, muat ke warehouse.
  spark-streaming:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
    environment:
      DW_HOST: postgres
      DW_PORT: 5432
      DW_DB: ${DW_DB:-air_quality_dw}
      DW_USER: ${POSTGRES_USER:-platform}
      DW_PASSWORD: ${POSTGRES_PASSWORD:-platform123}
    volumes:
      - ./spark/jobs:/opt/project/jobs:ro
      - ./sql:/opt/sql:ro
      - stream_data:/opt/stream
    ports:
      - "127.0.0.1:4040:4040"
    command:
      - spark-submit
      - --master
      - spark://spark-master:7077
      - --jars
      - /usr/share/java/postgresql.jar
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.memory=512m
      - --conf
      - spark.driver.memory=512m
      - --conf
      - spark.driver.host=spark-streaming
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.sql.session.timeZone=UTC
      - /opt/project/jobs/stream_clean_sensor.py
    restart: unless-stopped

volumes:
  pgdata:
  airflow_logs:
  stream_data: